name: Godot data validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Validate world catalogs
        run: godot --headless --path . --quit-after 10 --script res://tests/validate_data.gd
