name: Godot data validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Validate world catalogs
        shell: bash
        run: |
          output="$(godot --headless --path . --quit-after 10 --script res://tests/validate_data.gd 2>&1)"
          printf '%s\\n' "$output"
          printf '%s\\n' "$output" | grep -F "SIETE RAÍCES: regiones, misiones y catálogos validados correctamente."
      - name: Launch main scene headlessly
        shell: bash
        run: |
          output="$(godot --headless --path . --quit-after 5 2>&1)"
          printf '%s\\n' "$output"
          printf '%s\\n' "$output" | grep -F "SIETE RAÍCES: escena principal inicializada."
